name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_kotlin.jvm.target.validation.mode: IGNORE

jobs:
  test-and-analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: flutter_pdf_reader

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties

      - name: 获取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 运行测试
        run: flutter test

  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test-and-analyze

    defaults:
      run:
        working-directory: flutter_pdf_reader

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties

      - name: 获取依赖
        run: flutter pub get

      - name: 列出 Android SDK
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms dir"
          echo "=== Gradle 版本 ==="
          cat android/gradle/wrapper/gradle-wrapper.properties | grep distributionUrl

      - name: 构建 Debug APK（捕获详细日志）
        run: |
          flutter build apk --debug -v 2>&1 | tail -200
          echo "=== EXIT CODE: $? ==="

      - name: 查找 APK
        run: |
          echo "=== 搜索 APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "✅ 找到 APK: $APK"
            mkdir -p build/app/outputs/flutter-apk/
            cp "$APK" build/app/outputs/flutter-apk/all-pdf-reader-debug.apk
            ls -lh build/app/outputs/flutter-apk/all-pdf-reader-debug.apk
          else
            echo "❌ 未找到 APK"
          fi

      - name: 上传 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-pdf-reader-debug-apk
          path: flutter_pdf_reader/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-apk
    defaults:
      run:
        working-directory: flutter_pdf_reader
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with: { flutter-version: "3.24.5", cache: true }
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: 配置 Gradle
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
      - name: 获取依赖
        run: flutter pub get
      - name: 构建 Release APK
        run: flutter build apk --release
      - name: 构建 App Bundle
        run: flutter build appbundle --release
      - name: 重命名产物
        run: |
          mkdir -p build/release
          find . -name "*.apk" -type f | while read f; do cp "$f" build/release/all-pdf-reader-release.apk; done
          find . -name "*.aab" -type f | while read f; do cp "$f" build/release/all-pdf-reader-release.aab; done
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: All PDF Reader ${{ github.ref_name }}
          body_path: flutter_pdf_reader/RELEASE_NOTES.md
          files: |
            flutter_pdf_reader/build/release/all-pdf-reader-release.apk
            flutter_pdf_reader/build/release/all-pdf-reader-release.aab
          draft: false
          prerelease: false
