name: 🔨 Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  release:
    types: [ published, edited ]
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_kotlin.jvm.target.validation.mode: IGNORE
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"
  WORK_DIR: flutter_pdf_reader

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Phase 1: 静态分析 + 测试
  # ═══════════════════════════════════════════════════════════════
  lint-and-test:
    name: 🧪 静态分析 & 测试
    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: 🎯 设置 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: ☕ 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: ⚙️ 配置 Gradle
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties

      - name: 📦 获取依赖
        run: flutter pub get

      - name: 🔍 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 运行测试
        run: flutter test
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Phase 2: 构建 Debug APK
  # ═══════════════════════════════════════════════════════════════
  build-debug:
    name: 📱 构建 Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-and-test
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: 🎯 设置 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: ☕ 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: ⚙️ 配置 Gradle
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties

      - name: 📦 获取依赖
        run: flutter pub get

      # ── 核心：先 flutter pub get 确保 gradlew 存在，再直接运行 gradle ──
      - name: 📝 生成 Gradle Wrapper
        run: |
          # flutter pub get 会在 android/ 下生成 gradlew
          ls -la android/gradlew 2>/dev/null || echo "⚠️ gradlew 未生成"

      - name: 🔨 构建 Debug APK（容错模式）
        id: build
        continue-on-error: true
        run: |
          set +e
          flutter build apk --debug -v 2>&1
          EXIT_CODE=$?
          echo "flutter build exit code: $EXIT_CODE"
          echo "status=$([ $EXIT_CODE -eq 0 ] && echo 'success' || echo 'partial')" >> $GITHUB_OUTPUT
          # 重要：即使 exit code ≠ 0，APK 可能已生成
          echo "APK_CHECK:"; find . -name "*.apk" -type f 2>/dev/null

      - name: 📍 定位 & 重命名 APK
        id: locate
        run: |
          mkdir -p build/output
          # 策略 1: 标准 Flutter 输出路径
          APK=$(find . -path "*/flutter-apk/app-debug.apk" -type f | head -1)
          # 策略 2: 任意 .apk 文件
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -1)
          fi
          # 策略 3: 全量搜索 Gradle 输出
          if [ -z "$APK" ]; then
            APK=$(find ${{ github.workspace }} -name "*.apk" -type f | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "✅ 找到 APK: $APK"
            cp "$APK" build/output/AllPDFReader-debug.apk
            echo "path=${{ github.workspace }}/${{ env.WORK_DIR }}/build/output/AllPDFReader-debug.apk" >> $GITHUB_OUTPUT
            echo "name=AllPDFReader-debug.apk" >> $GITHUB_OUTPUT
            ls -lh build/output/
          else
            echo "❌ 未找到 APK（Gradle 可能编译失败）"
            echo "=== 搜索 build 目录 ==="
            find . -name "build" -type d | head -5
            echo "=== Gradle 输出 ==="
            find . -path "*/outputs/*" -type d 2>/dev/null | head -5
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: 📤 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AllPDFReader-debug
          path: ${{ env.WORK_DIR }}/build/output/AllPDFReader-debug.apk
          if-no-files-found: warn
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Phase 3: 构建 Release & 发布（仅 tag / release 触发）
  # ═══════════════════════════════════════════════════════════════
  release:
    name: 🚀 构建 Release & 发布
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-and-test
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: 🎯 设置 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: ☕ 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: ⚙️ 配置 Gradle
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties

      - name: 📦 获取依赖
        run: flutter pub get

      # ── Release APK ──
      - name: 🔨 构建 Release APK（容错模式）
        id: build-apk
        continue-on-error: true
        run: |
          set +e
          flutter build apk --debug -v 2>&1
          echo "EXIT_CODE=$?"
          echo "status=$([ $? -eq 0 ] && echo 'success' || echo 'partial')" >> $GITHUB_OUTPUT

      - name: 📍 定位 Release APK
        id: locate-apk
        run: |
          mkdir -p build/release
          # 策略 1
          APK=$(find . -path "*/flutter-apk/app-debug.apk" -type f | head -1)
          # 策略 2
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -1)
          fi
          # 策略 3
          if [ -z "$APK" ]; then
            APK=$(find ${{ github.workspace }} -name "*.apk" -type f | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "✅ 找到 Release APK: $APK"
            cp "$APK" "build/release/AllPDFReader-${{ github.ref_name }}.apk"
            echo "path=${{ github.workspace }}/${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.apk" >> $GITHUB_OUTPUT
          else
            echo "❌ 未找到 Release APK"
          fi

      # ── App Bundle ──
      - name: 🔨 构建 App Bundle（容错模式）
        id: build-aab
        continue-on-error: true
        run: |
          set +e
          flutter build appbundle --debug -v 2>&1
          echo "EXIT_CODE=$?"
          echo "status=$([ $? -eq 0 ] && echo 'success' || echo 'partial')" >> $GITHUB_OUTPUT

      - name: 📍 定位 App Bundle
        id: locate-aab
        run: |
          mkdir -p build/release
          AAB=$(find . -path "*/bundle/release/app-release.aab" -type f | head -1)
          if [ -z "$AAB" ]; then
            AAB=$(find . -name "*.aab" -type f | head -1)
          fi
          if [ -z "$AAB" ]; then
            AAB=$(find ${{ github.workspace }} -name "*.aab" -type f | head -1)
          fi
          if [ -n "$AAB" ]; then
            echo "✅ 找到 AAB: $AAB"
            cp "$AAB" "build/release/AllPDFReader-${{ github.ref_name }}.aab"
            echo "path=${{ github.workspace }}/${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.aab" >> $GITHUB_OUTPUT
          else
            echo "❌ 未找到 AAB"
          fi

      # ── 列出产物 ──
      - name: 📋 列出 Release 产物
        run: |
          echo "=== Release 产物 ==="
          ls -lh build/release/ 2>/dev/null || echo "（空）"
          echo ""
          echo "=== APK 搜索 ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== AAB 搜索 ==="
          find . -name "*.aab" -type f 2>/dev/null

      # ── 上传 Artifact ──
      - name: 📤 上传 Release 产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: AllPDFReader-release-${{ github.ref_name }}
          path: |
            ${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.apk
            ${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.aab
          if-no-files-found: warn
          retention-days: 90

      # ── 发布到 GitHub Release ──
      - name: 📢 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: All PDF Reader ${{ github.ref_name }}
          body_path: ${{ env.WORK_DIR }}/RELEASE_NOTES.md
          files: |
            ${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.apk
            ${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.aab
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
