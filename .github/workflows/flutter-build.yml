name: 🔨 Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  release:
    types: [ published, edited ]
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_kotlin.jvm.target.validation.mode: IGNORE
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"
  WORK_DIR: flutter_pdf_reader

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Phase 1: 静态分析 + 测试（所有分支共用）
  # ═══════════════════════════════════════════════════════════════
  lint-and-test:
    name: 🧪 静态分析 & 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: 🎯 设置 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: ☕ 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: ⚙️ 配置 Gradle
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties

      - name: 📦 获取依赖
        run: flutter pub get

      - name: 🔍 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 运行测试
        run: flutter test
        continue-on-error: true  # 测试失败不阻断构建

  # ═══════════════════════════════════════════════════════════════
  # Phase 2: 构建 Debug APK（每次 push / workflow_dispatch）
  # ═══════════════════════════════════════════════════════════════
  build-debug:
    name: 📱 构建 Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-and-test
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: 🎯 设置 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: ☕ 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: ⚙️ 配置 Gradle
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties

      - name: 📦 获取依赖
        run: flutter pub get

      - name: 🔨 构建 Debug APK
        id: build
        run: |
          flutter build apk --debug
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📍 定位 & 重命名 APK
        id: locate
        run: |
          APK=$(find . -path "*/flutter-apk/app-debug.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "✅ 找到 APK: $APK"
            mkdir -p build/output
            cp "$APK" build/output/AllPDFReader-debug.apk
            echo "path=${{ github.workspace }}/${{ env.WORK_DIR }}/build/output/AllPDFReader-debug.apk" >> $GITHUB_OUTPUT
            echo "name=AllPDFReader-debug.apk" >> $GITHUB_OUTPUT
          else
            echo "❌ 未找到 APK"
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: 📤 上传 Debug APK（构建 Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: AllPDFReader-debug
          path: ${{ env.WORK_DIR }}/build/output/AllPDFReader-debug.apk
          if-no-files-found: warn
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Phase 3: 构建 Release APK + AAB + 发布到 GitHub Release
  # 仅在推送 tag (v*) 或 Release 发布时触发
  # ═══════════════════════════════════════════════════════════════
  release:
    name: 🚀 构建 Release & 发布
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-and-test
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: 🎯 设置 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: ☕ 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: ⚙️ 配置 Gradle
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties

      - name: 📦 获取依赖
        run: flutter pub get

      # ── Release APK ──
      - name: 🔨 构建 Release APK
        id: build-apk
        run: |
          flutter build apk --release
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📍 定位 Release APK
        id: locate-apk
        run: |
          APK=$(find . -path "*/flutter-apk/app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "✅ 找到 Release APK: $APK"
            mkdir -p build/release
            cp "$APK" "build/release/AllPDFReader-${{ github.ref_name }}.apk"
            echo "path=${{ github.workspace }}/${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.apk" >> $GITHUB_OUTPUT
          else
            echo "❌ 未找到 Release APK"
          fi

      # ── App Bundle ──
      - name: 🔨 构建 App Bundle
        id: build-aab
        run: |
          flutter build appbundle --release
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📍 定位 App Bundle
        id: locate-aab
        run: |
          AAB=$(find . -path "*/bundle/release/app-release.aab" -type f | head -1)
          if [ -z "$AAB" ]; then
            AAB=$(find . -name "*.aab" -type f | head -1)
          fi
          if [ -n "$AAB" ]; then
            echo "✅ 找到 AAB: $AAB"
            mkdir -p build/release
            cp "$AAB" "build/release/AllPDFReader-${{ github.ref_name }}.aab"
            echo "path=${{ github.workspace }}/${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.aab" >> $GITHUB_OUTPUT
          else
            echo "❌ 未找到 AAB"
          fi

      # ── 列出产物 ──
      - name: 📋 列出 Release 产物
        run: |
          echo "=== Release 产物 ==="
          ls -lh build/release/
          echo ""
          echo "=== 文件校验 ==="
          for f in build/release/*; do
            if [ -f "$f" ]; then
              echo "$(basename $f): $(stat --format=%s $f) bytes"
            fi
          done

      # ── 上传 Artifact（保留备份） ──
      - name: 📤 上传 Release 产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: AllPDFReader-release-${{ github.ref_name }}
          path: |
            ${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.apk
            ${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.aab
          if-no-files-found: warn
          retention-days: 90

      # ── 创建/更新 GitHub Release 并上传 Assets ──
      - name: 📢 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: All PDF Reader ${{ github.ref_name }}
          body_path: ${{ env.WORK_DIR }}/RELEASE_NOTES.md
          files: |
            ${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.apk
            ${{ env.WORK_DIR }}/build/release/AllPDFReader-${{ github.ref_name }}.aab
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
