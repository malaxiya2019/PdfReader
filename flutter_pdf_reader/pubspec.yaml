publish_to: 'none'
version: 1.3.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.6
  file_picker: 8.0.3
  shared_preferences: 2.2.3
  path_provider: 2.1.3
  intl: 0.19.0
  syncfusion_flutter_pdfviewer: 26.1.35
  syncfusion_flutter_pdf: 26.1.35
  image_picker: 1.0.7
  google_mlkit_text_recognition: 0.12.0
  image: 4.1.7
  http: 1.2.1
  pdf_render: 1.4.2
  permission_handler: 11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
