name: all_pdf_reader
description: "All PDF Reader - 高颜值暗黑风 PDF 阅读器"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  intl: ^0.19.0
  syncfusion_flutter_pdfviewer: ^24.0.0
  syncfusion_flutter_pdf: ^24.0.0

  image_picker: ^1.0.0
  google_mlkit_text_recognition: ^0.13.0
  image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
