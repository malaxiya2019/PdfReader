<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#121222"/>
    </linearGradient>
    <linearGradient id="doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E53935"/>
      <stop offset="100%" style="stop-color:#EF5350"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300"/>
      <stop offset="100%" style="stop-color:#FFD54F"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#E53935" stroke-width="3"/>

  <!-- Document body -->
  <path d="M176 180 L176 380 Q176 400 196 400 L336 400 Q356 400 356 380 L356 240 L296 180 Z"
        fill="url(#doc)" stroke="#C62828" stroke-width="1.5"/>

  <!-- Document fold (top-right corner) -->
  <path d="M296 180 L356 240 L296 240 Z" fill="#C62828"/>

  <!-- Text lines on document -->
  <rect x="200" y="260" width="120" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
  <rect x="200" y="278" width="100" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="200" y="296" width="110" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="200" y="314" width="90" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Play/Read triangle -->
  <polygon points="220,340 260,358 220,376" fill="url(#acc)" opacity="0.9"/>

  <!-- Bookmark ribbon -->
  <path d="M316 180 L316 220 L330 210 L344 220 L344 180 Z"
        fill="url(#acc)" opacity="0.85"/>

  <!-- "PDF" text -->
  <text x="174" y="150" font-family="Arial, Helvetica, sans-serif"
        font-size="42" font-weight="bold" fill="#E53935" letter-spacing="4"
        textLength="160" lengthAdjust="spacing">PDF</text>

  <!-- Small accent dots -->
  <circle cx="176" cy="130" r="3" fill="#FFB300" opacity="0.7"/>
  <circle cx="336" cy="130" r="3" fill="#FFB300" opacity="0.7"/>

  <!-- Ring decoration -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#E53935" stroke-width="0.5" opacity="0.2"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFB300" stroke-width="0.3" opacity="0.1"/>
</svg>
